<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>無限階段</title>
<style>
  :root { --bg: #14161f; --panel: rgba(20, 24, 44, 0.88); --fg: #eef0ff; --muted: #9aa0c4; --gold: #ffd25a; --line: rgba(255,255,255,0.14); color-scheme: dark; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg); overflow: hidden; font-family: sans-serif; }
  canvas { display: block; margin: 0 auto; touch-action: manipulation; user-select: none; -webkit-user-select: none; }
  #rank {
    position: fixed; top: 150px; right: 16px;
    width: 200px; padding: 10px 12px; background: var(--panel);
    border: 1px solid var(--line); border-radius: 10px;
  }
  #rank h2 { margin: 0 0 6px; font-size: 13px; letter-spacing: 0.08em; color: var(--muted); }
  #rank ol { margin: 0; padding: 0; list-style: none; display: grid; gap: 3px; }
  #rank li { display: grid; grid-template-columns: 22px 1fr auto; gap: 6px; font-size: 14px; font-variant-numeric: tabular-nums; }
  #rank li .n { color: var(--muted); }
  #rank li .name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #rank li.me { color: var(--gold); font-weight: bold; }
  #rank label { display: block; margin-top: 10px; font-size: 12px; color: var(--muted); }
  #rank input {
    width: 100%; box-sizing: border-box; margin-top: 4px; padding: 5px 7px;
    background: transparent; color: var(--fg); border: 1px solid var(--line); border-radius: 6px; font-size: 14px;
  }
  #rank input:focus { outline: 2px solid var(--gold); outline-offset: 0; }
  #rank p { margin: 6px 0 0; font-size: 12px; color: var(--muted); }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="rank" hidden>
  <h2>ランキング</h2>
  <ol id="rankList"></ol>
  <label for="nameInput">なまえ(ランキングに表示)</label>
  <input id="nameInput" maxlength="12" placeholder="名無し" autocomplete="off">
  <p id="rankNote"></p>
</div>
<script>
// ===== Supabase の設定 =====
// Supabase の「Project Settings → API」にある値を貼り付けてください。
// 空のままだとランキングなしで遊べます。
const SUPABASE_URL = 'https://aeovzvbsdbpdgkasuppm.supabase.co';
const SUPABASE_KEY = 'sb_publishable_vTYcq-C9xWv47s3uV2Sj-Q_KxeaYkhu';   // publishable key(公開して大丈夫な方)

const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');

// ---- 設定 ----
const STEP_W = 90;          // 段の幅
const STEP_H = 18;          // 段の厚さ
const RISE = 60;            // 1段あたりの高さ
const VISIBLE_AHEAD = 4;    // 何段先まで見えるか
const TIME_START = 1.6;     // 最初の制限時間(秒)
const TIME_MIN = 0.45;      // 最短の制限時間(秒)
const TIME_DECAY = 0.97;    // 1段ごとに制限時間に掛ける係数

let W, H;
function resize() {
  W = canvas.width = Math.min(window.innerWidth, 720);
  H = canvas.height = window.innerHeight;
}
window.addEventListener('resize', resize);
resize();

function load(key, fallback) {
  try { return localStorage.getItem(key) ?? fallback; } catch { return fallback; }
}
function save(key, v) {
  try { localStorage.setItem(key, v); } catch {}
}

let best = Number(load('stairsBest', 0));
let steps, idx, score, timeLimit, timeLeft, state, player, cam, fallTimer, particles;

function reset() {
  steps = [0];               // 各段の x(列番号)
  for (let i = 0; i < 20; i++) addStep();
  idx = 0;
  score = 0;
  timeLimit = TIME_START;
  timeLeft = timeLimit;
  state = 'ready';           // ready -> play -> fall
  player = { x: 0, y: 0, vx: 0, vy: 0, anim: 1, fromX: 0, fromY: 0 };
  cam = { x: 0, y: 0 };
  fallTimer = 0;
  particles = [];
}

function addStep() {
  const last = steps[steps.length - 1];
  steps.push(last + (Math.random() < 0.5 ? -1 : 1));
}

// 段の座標(ワールド)
const stepX = i => steps[i] * STEP_W;
const stepY = i => -i * RISE;

function move(dir) {
  if (state === 'fall') {
    if (fallTimer > 0.8) reset();
    return;
  }
  if (state === 'ready') state = 'play';

  const target = steps[idx + 1];
  const want = steps[idx] + dir;
  player.fromX = stepX(idx);
  player.fromY = stepY(idx);

  if (want === target) {
    idx++;
    score++;
    if (score > best) { best = score; save('stairsBest', best); }
    while (steps.length < idx + 20) addStep();
    timeLimit = Math.max(TIME_MIN, timeLimit * TIME_DECAY);
    timeLeft = timeLimit;
    player.anim = 0;
  } else {
    // 何もない方向に踏み出した → 落下
    player.x = want * STEP_W;
    player.y = stepY(idx) - RISE * 0.5;
    startFall(dir * 120);
  }
}

// ---- 全員共有ランキング(Supabase) ----
const rankEl = document.getElementById('rank');
const rankList = document.getElementById('rankList');
const rankNote = document.getElementById('rankNote');
const nameInput = document.getElementById('nameInput');
const rankOn = Boolean(SUPABASE_URL && SUPABASE_KEY);

// 端末ごとのプレイヤーID(同じ人の記録を1つにまとめるため)
let playerId = load('stairsPlayerId', null);
if (!playerId) {
  playerId = crypto.randomUUID ? crypto.randomUUID()
    : 'xxxxxxxx-xxxx-4xxx-8xxx-xxxxxxxxxxxx'.replace(/x/g, () => (Math.random() * 16 | 0).toString(16));
  save('stairsPlayerId', playerId);
}
let sentBest = Number(load('stairsSentBest', 0));   // ランキングに送った自己ベスト
nameInput.value = load('stairsName', '');
nameInput.addEventListener('input', () => save('stairsName', nameInput.value.trim()));
// 名前を入力し終えたら Enter でゲームに戻る
nameInput.addEventListener('keydown', e => { if (e.key === 'Enter') nameInput.blur(); });

function playerName() {
  return nameInput.value.trim().slice(0, 12) || '名無し';
}

function api(path, options = {}) {
  return fetch(`${SUPABASE_URL}/rest/v1/${path}`, {
    ...options,
    headers: { apikey: SUPABASE_KEY, 'Content-Type': 'application/json', ...options.headers }
  });
}

async function loadRanking() {
  try {
    const res = await api('leaderboard?select=name,score');
    if (!res.ok) throw new Error(res.status);
    renderRanking(await res.json());
  } catch {
    rankNote.textContent = 'ランキングを読み込めませんでした';
  }
}

function renderRanking(rows) {
  const myName = playerName();
  rankList.replaceChildren(...rows.map((r, i) => {
    const li = document.createElement('li');
    if (r.name === myName && r.score === sentBest) li.className = 'me';
    const n = document.createElement('span'); n.className = 'n'; n.textContent = i + 1;
    const name = document.createElement('span'); name.className = 'name'; name.textContent = r.name;
    const s = document.createElement('span'); s.textContent = r.score + ' 段';
    li.append(n, name, s);
    return li;
  }));
  rankNote.textContent = rows.length ? '' : 'まだ記録がありません';
}

async function submitScore(s) {
  if (!rankOn || s <= sentBest) return;
  try {
    const res = await api('scores', {
      method: 'POST',
      headers: { Prefer: 'return=minimal' },
      body: JSON.stringify({ player_id: playerId, name: playerName(), score: s })
    });
    if (!res.ok) throw new Error(res.status);
    sentBest = s;
    save('stairsSentBest', s);
    loadRanking();
  } catch {
    rankNote.textContent = '記録を送れませんでした';
  }
}

function startFall(vx) {
  submitScore(score);
  state = 'fall';
  fallTimer = 0;
  player.vx = vx;
  player.vy = -250;
  // 足場が崩れるエフェクト
  for (let i = 0; i < 18; i++) {
    particles.push({
      x: stepX(idx) + (Math.random() - 0.5) * STEP_W,
      y: stepY(idx),
      vx: (Math.random() - 0.5) * 200,
      vy: -Math.random() * 200,
      life: 1
    });
  }
}

window.addEventListener('keydown', e => {
  if (e.target === nameInput || e.repeat) return;
  const k = e.key.toLowerCase();
  if (k === 'a') move(-1);
  else if (k === 'd') move(1);
  else if (k === ' ' && state === 'fall' && fallTimer > 0.8) reset();
});

// スマホ用:画面の左半分タップ = A、右半分 = D
canvas.addEventListener('pointerdown', e => {
  e.preventDefault();
  nameInput.blur();
  const rect = canvas.getBoundingClientRect();
  move(e.clientX - rect.left < rect.width / 2 ? -1 : 1);
});

let last = performance.now();
function loop(now) {
  const dt = Math.min(0.05, (now - last) / 1000);
  last = now;
  update(dt);
  draw();
  requestAnimationFrame(loop);
}

function update(dt) {
  const hideRank = !rankOn || state === 'play';
  if (rankEl.hidden !== hideRank) rankEl.hidden = hideRank;

  if (state === 'play') {
    timeLeft -= dt;
    if (timeLeft <= 0) {
      timeLeft = 0;
      player.x = stepX(idx);
      player.y = stepY(idx);
      startFall(0);
    }
  }

  if (state === 'fall') {
    fallTimer += dt;
    player.vy += 1400 * dt;
    player.x += player.vx * dt;
    player.y += player.vy * dt;
  } else {
    // 段の移動アニメーション(放物線)
    player.anim = Math.min(1, player.anim + dt * 9);
    const t = player.anim;
    const tx = stepX(idx), ty = stepY(idx);
    player.x = player.fromX + (tx - player.fromX) * t;
    player.y = player.fromY + (ty - player.fromY) * t - Math.sin(t * Math.PI) * 25;
    if (t >= 1) { player.x = tx; player.y = ty; }
  }

  // カメラ追従(落下中は止める)
  if (state !== 'fall') {
    const targetX = stepX(idx), targetY = stepY(idx) - RISE * 1.5;
    cam.x += (targetX - cam.x) * Math.min(1, dt * 10);
    cam.y += (targetY - cam.y) * Math.min(1, dt * 10);
  }

  for (const p of particles) {
    p.vy += 900 * dt;
    p.x += p.vx * dt;
    p.y += p.vy * dt;
    p.life -= dt;
  }
  particles = particles.filter(p => p.life > 0);
}

function toScreen(x, y) {
  return [x - cam.x + W / 2, y - cam.y + H * 0.55];
}

function draw() {
  // 背景
  const g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, '#1d2340');
  g.addColorStop(1, '#0e0f17');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, W, H);

  // 段を描画:通過済みの段は消えている、現在の段+4段先まで見える
  for (let i = idx; i <= idx + VISIBLE_AHEAD; i++) {
    if (state === 'fall' && i === idx) continue; // 崩れた足場
    const [sx, sy] = toScreen(stepX(i), stepY(i));
    const ahead = i - idx;
    const alpha = 1 - Math.max(0, ahead - 1) * 0.18;
    let color = '#7a86c2';
    const shaking = i === idx && state === 'play' && timeLeft / timeLimit < 0.35;
    if (i === idx) {
      // 残り時間が少ないほど赤く・揺れる
      const r = timeLeft / timeLimit;
      color = `hsl(${120 * r}, 60%, 55%)`;
      if (shaking) {
        const shake = (1 - r / 0.35) * 3;
        ctx.save();
        ctx.translate((Math.random() - 0.5) * shake, (Math.random() - 0.5) * shake);
      }
    }
    ctx.globalAlpha = alpha;
    ctx.fillStyle = color;
    ctx.fillRect(sx - STEP_W / 2, sy, STEP_W, STEP_H);
    ctx.fillStyle = 'rgba(255,255,255,0.25)';
    ctx.fillRect(sx - STEP_W / 2, sy, STEP_W, 4);
    ctx.globalAlpha = 1;
    if (shaking) ctx.restore();
  }

  // 破片
  ctx.fillStyle = '#c86b6b';
  for (const p of particles) {
    const [sx, sy] = toScreen(p.x, p.y);
    ctx.globalAlpha = Math.max(0, p.life);
    ctx.fillRect(sx - 4, sy - 4, 8, 8);
  }
  ctx.globalAlpha = 1;

  // プレイヤー
  const [px, py] = toScreen(player.x, player.y);
  ctx.fillStyle = '#ffd25a';
  ctx.beginPath();
  ctx.roundRect(px - 14, py - 40, 28, 40, 8);
  ctx.fill();
  ctx.fillStyle = '#222';
  ctx.fillRect(px - 7, py - 30, 4, 6);
  ctx.fillRect(px + 3, py - 30, 4, 6);

  // UI
  ctx.fillStyle = '#fff';
  ctx.textAlign = 'center';
  ctx.font = 'bold 56px sans-serif';
  ctx.fillText(score, W / 2, 80);
  ctx.font = '16px sans-serif';
  ctx.fillStyle = '#aab';
  ctx.fillText(`BEST ${best}`, W / 2, 106);

  // タイマーバー
  const barW = Math.min(300, W - 40);
  const r = state === 'fall' ? 0 : timeLeft / timeLimit;
  ctx.fillStyle = 'rgba(255,255,255,0.15)';
  ctx.fillRect(W / 2 - barW / 2, 122, barW, 10);
  ctx.fillStyle = `hsl(${120 * r}, 70%, 55%)`;
  ctx.fillRect(W / 2 - barW / 2, 122, barW * r, 10);

  ctx.font = '18px sans-serif';
  ctx.fillStyle = '#ccd';
  if (state === 'ready') {
    ctx.fillText('A / 画面左タップ: 左上の段へ', W / 2, H - 86);
    ctx.fillText('D / 画面右タップ: 右上の段へ', W / 2, H - 60);
    ctx.fillText('どちらかでスタート', W / 2, H - 34);
  } else if (state === 'fall' && fallTimer > 0.8) {
    ctx.fillStyle = 'rgba(0,0,0,0.5)';
    ctx.fillRect(0, H / 2 - 70, W, 130);
    ctx.fillStyle = '#ff7b7b';
    ctx.font = 'bold 40px sans-serif';
    ctx.fillText('落ちた！', W / 2, H / 2 - 15);
    ctx.fillStyle = '#fff';
    ctx.font = '18px sans-serif';
    ctx.fillText(`記録: ${score} 段`, W / 2, H / 2 + 20);
    ctx.fillText('A / D / Space / タップでリトライ', W / 2, H / 2 + 44);
  }
}

reset();
requestAnimationFrame(loop);
if (rankOn) loadRanking();
</script>
</body>
</html>
